name: Update AUR

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン実行（AURを更新せず確認のみ）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  update-aur:
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install required packages
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git namcap openssh clang cmake rust

      - name: Set version
        id: version
        run: |
          # 最新リリースからバージョンを取得
          VERSION=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ -z "$VERSION" ]]; then
            echo "❌ エラー: 最新リリースが見つかりません"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Clone AUR package
        run: |
          git clone https://aur.archlinux.org/colmsg.git "$GITHUB_WORKSPACE/aur-colmsg"

      - name: Get package version and source commit
        id: package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          COMMIT_HASH=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v$VERSION" | cut -f1)
          if [[ -z "$COMMIT_HASH" ]]; then
            echo "❌ エラー: タグ v$VERSION が見つかりません"
            exit 1
          fi
          echo "✅ コミットハッシュ: $COMMIT_HASH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT_HASH" >> "$GITHUB_OUTPUT"

      - name: Build and verify AUR package
        env:
          PKG_VERSION: ${{ steps.package.outputs.version }}
          COMMIT_HASH: ${{ steps.package.outputs.commit }}
        run: |
          SOURCE_SPEC="git+\$url#commit=$COMMIT_HASH"
          bash "$GITHUB_WORKSPACE/.github/scripts/aur-package-build.sh" \
            "$GITHUB_WORKSPACE/aur-colmsg" "$PKG_VERSION" "$SOURCE_SPEC"

      - name: Show git diff
        run: |
          echo "📝 Git差分"
          cd "$GITHUB_WORKSPACE/aur-colmsg"
          git config --global --add safe.directory "$PWD"
          git diff --color=always
          if [[ -z "$(git diff)" ]]; then
            echo "⚠️  警告: 変更がありません。バージョンが既に更新済みの可能性があります。"
          fi

      - name: Show final summary
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PKG_VERSION: ${{ steps.package.outputs.version }}
        run: |
          echo "========================================="
          echo "📊 最終確認サマリー"
          echo "========================================="
          echo "バージョン: $RELEASE_VERSION"
          echo "コミットメッセージ: colmsg version${PKG_VERSION}"
          echo ""
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "🔍 ドライラン: 以下の操作はスキップされました"
            echo "  - Gitへのコミット"
            echo "  - AURへのプッシュ"
          else
            echo "✅ 実際のAUR更新を実行します"
          fi
          echo "========================================="

      - name: Setup SSH
        if: ${{ !inputs.dry_run }}
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n  StrictHostKeyChecking no\n' > ~/.ssh/config
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        run: |
          cd "$GITHUB_WORKSPACE/aur-colmsg"
          chown root:root PKGBUILD .SRCINFO
          git remote set-url origin ssh://aur@aur.archlinux.org/colmsg.git
          git config user.name "${{ secrets.AUR_USERNAME }}"
          git config user.email "${{ secrets.AUR_EMAIL }}"
          git add PKGBUILD .SRCINFO
          git commit -m "colmsg version${{ steps.package.outputs.version }}"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o StrictHostKeyChecking=no" git push

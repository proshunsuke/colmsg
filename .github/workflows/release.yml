name: Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン実行（リリースを作成せず確認のみ）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -n1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
      
      - name: Check if tag already exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.version }}"; then
            echo "::warning::Tag ${{ steps.version.outputs.version }} already exists"
            if [[ "${{ inputs.dry_run }}" != "true" ]]; then
              echo "::error::Cannot create release - tag already exists"
              exit 1
            fi
          fi
      
      - name: Show release info
        run: |
          echo "📋 リリース情報"
          echo "バージョン: ${{ steps.version.outputs.version }}"
          echo "タグ: refs/tags/${{ steps.version.outputs.version }}"
          echo "CHANGELOG.md の存在: $(test -f CHANGELOG.md && echo '✅' || echo '❌')"
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "🔍 ドライランモードで実行中"
          fi

  build-binaries:
    needs: get-version
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Setup Cross for Linux ARM
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Install GNU Make on Windows
        if: runner.os == 'Windows'
        run: choco install make --version=4.4.1 --yes --no-progress
      
      - name: Build binary
        run: make build-release TARGET=${{ matrix.target }}
        shell: bash
      
      - name: Create archive
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION=${{ needs.get-version.outputs.version }}
          ARCHIVE_NAME="colmsg-${VERSION}-${{ matrix.target }}"
          
          cd target/${{ matrix.target }}/release
          
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            # Windows
            7z a "../../../${ARCHIVE_NAME}.zip" colmsg.exe
            echo "ARCHIVE_PATH=${ARCHIVE_NAME}.zip" >> $GITHUB_ENV
          else
            # Unix
            tar -czf "../../../${ARCHIVE_NAME}.tar.gz" colmsg
            echo "ARCHIVE_PATH=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV
          fi
        shell: bash
      
      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: colmsg-${{ matrix.target }}
          path: ${{ env.ARCHIVE_PATH }}
          retention-days: 7
      
      - name: Show build info
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "✅ ビルド完了"
          echo "ターゲット: ${{ matrix.target }}"
          echo "アーカイブ: ${{ env.ARCHIVE_PATH }}"

  create-release:
    if: github.event_name == 'workflow_dispatch'
    needs: [get-version, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: List artifacts
        run: |
          echo "📦 ビルドされたアーティファクト:"
          ls -la artifacts/*
      
      - name: Create Release
        if: ${{ !inputs.dry_run }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts/*/*.tar.gz,artifacts/*/*.zip"
          tag: ${{ needs.get-version.outputs.version }}
          name: ${{ needs.get-version.outputs.version }}
          generateReleaseNotes: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Dry run - Show what would be released
        if: ${{ inputs.dry_run }}
        run: |
          echo "🔍 ドライラン: 以下の内容でリリースが作成されます"
          echo "タグ: ${{ needs.get-version.outputs.version }}"
          echo "リリース名: ${{ needs.get-version.outputs.version }}"
          echo "アーティファクト:"
          find artifacts -name "*.tar.gz" -o -name "*.zip" | while read f; do
            echo "  - $(basename $f)"
          done

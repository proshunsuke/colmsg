name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン実行（リリースを作成せず確認のみ）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build_release:
    name: Build and verify release binaries
    uses: ./.github/workflows/release-build.yml
    with:
      package: true
      dry_run: ${{ inputs.dry_run }}
    permissions:
      contents: read

  create-release:
    needs: build_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: colmsg-*
          path: artifacts

      - name: List artifacts
        run: |
          echo "📦 ビルドされたアーティファクト:"
          ls -la artifacts/*

      - name: Create Release
        if: ${{ !inputs.dry_run }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts/*/*.tar.gz,artifacts/*/*.zip"
          tag: ${{ needs.build_release.outputs.version }}
          name: ${{ needs.build_release.outputs.version }}
          generateReleaseNotes: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry run - Show what would be released
        if: ${{ inputs.dry_run }}
        run: |
          echo "🔍 ドライラン: 以下の内容でリリースが作成されます"
          echo "タグ: ${{ needs.build_release.outputs.version }}"
          echo "リリース名: ${{ needs.build_release.outputs.version }}"
          echo "アーティファクト:"
          find artifacts -name "*.tar.gz" -o -name "*.zip" | while read f; do
            echo "  - $(basename $f)"
          done

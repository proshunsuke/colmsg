[package]
name = "colmsg"
version = "4.0.0"
authors = ["proshunsuke <shunsuke0901@gmail.com>"]
categories = ["command-line-utilities"]
description="A CLI tool for '櫻坂46メッセージ', '日向坂46メッセージ', '乃木坂46メッセージ', '齋藤飛鳥メッセージ', '白石麻衣メッセージ', and 'yodel' app."
homepage = "https://github.com/proshunsuke/colmsg"
license = "MIT"
readme = "README.md"
repository = "https://github.com/proshunsuke/colmsg"
edition = "2018"
rust-version = "1.98.1"

[features]
default = []
401 = [ "rand" ]

[dependencies]
console = "^0.16.6"
ansi_term = "^0.12.1"
ansi_colours = "^1.0"
dirs = "^2.0.2"
lazy_static = "^1.4.0"
wild = "^2.0.0"
shell-words = "^0.1.0"
chrono = "^0.4.10"
serde_json = "^1.0.0"
walkdir = "^2.3.1"
rayon = "^1.12.0"
regex = "^1.3.5"
url = "^2.1.1"
tempfile = "3.27.0"
thiserror = "2"

[dependencies.serde]
version = "^1.0.104"
default-features = false
features = ["derive"]

[dependencies.clap]
version = "^2.33.0"
default-features = false
features = ["suggestions", "color", "wrap_help"]

[dependencies.reqwest]
version = "^0.13.5"
default-features = false
features = ["blocking", "json", "default-tls", "gzip"]

[dependencies.rand]
version = "^0.7.3"
optional = true

[dev-dependencies]
tempdir = "^0.3.7"
assert_cmd = "^0.12.0"
escargot = "^0.5.0"
mockito = "1.7.2"
libc = "0.2.189"

[build-dependencies]
clap = "^2.33.0"
liquid = "^0.19.0"
lazy_static = "^1.4.0"

[profile.release]
lto = true
